spring.application.name=student-logging-exception

server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/student_logging_db
spring.datasource.username=root
spring.datasource.password=admin@123

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.studentloggingexception=DEBUG

# Write logs to a file
logging.file.name=logs/student-management.log